<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Smart Daily Expenses Tracker & Financial Manager</title>
    <meta name="description" content="Professional daily income, expense, and budget management system with multi-account ledgers, analytics, and Indian Rupee financial reporting." />
    <meta property="og:title" content="Smart Daily Expenses Tracker & Financial Manager" />
    <meta property="og:description" content="Professional daily income, expense, and budget management system with multi-account ledgers, analytics, and Indian Rupee financial reporting." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Mobile & PWA Theme & Status Bar -->
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Budget Management" />

    <!-- Web App Manifest for PWA Installation -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- PWA Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <script>
      try {
        var rawData = localStorage.getItem('dhanvault_financial_data_v1');
        if (rawData) {
          var cfg = JSON.parse(rawData);
          if (cfg && cfg.settings && cfg.settings.darkMode) {
            document.documentElement.classList.add('dark');
          } else if (cfg && cfg.settings && cfg.settings.darkMode === false) {
            document.documentElement.classList.remove('dark');
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-100 selection:text-emerald-900 dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
