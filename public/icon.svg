<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#34d399" stroke-width="8" stroke-dasharray="16 12" opacity="0.35" />

  <!-- Vault Shield / Core Circle -->
  <circle cx="256" cy="256" r="150" fill="#022c22" opacity="0.65" filter="url(#shadow)" />

  <!-- Indian Rupee Symbol (₹) -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <!-- Top Horizontal Bar 1 -->
    <line x1="168" y1="160" x2="344" y2="160" />
    <!-- Top Horizontal Bar 2 -->
    <line x1="168" y1="210" x2="310" y2="210" />
    <!-- Vertical Stem -->
    <line x1="216" y1="160" x2="216" y2="280" />
    <!-- Upper Curve -->
    <path d="M 216 160 H 290 C 330 160 330 260 290 260 H 216" />
    <!-- Diagonal Slanted Leg -->
    <line x1="240" y1="260" x2="330" y2="360" />
  </g>

  <!-- Corner Security Dots -->
  <circle cx="256" cy="72" r="8" fill="#34d399" opacity="0.7" />
  <circle cx="256" cy="440" r="8" fill="#34d399" opacity="0.7" />
  <circle cx="72" cy="256" r="8" fill="#34d399" opacity="0.7" />
  <circle cx="440" cy="256" r="8" fill="#34d399" opacity="0.7" />
</svg>
